insmod all_video
insmod png
insmod gfxterm

set gfxmode=1024x768
set gfxpayload=keep
terminal_output gfxterm

search --no-floppy --set=root --label %ISO_LABEL%

if background_image /boot/grub/splash.png; then
    set color_normal=white/black
    set color_highlight=black/white
else
    set menu_color_normal=white/black
    set menu_color_highlight=black/white
fi

set default=0
set timeout=15
set timeout_style=menu

menuentry "Boot xyloOS Installer (Default)" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ISO_LABEL% quiet
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Boot xyloOS Installer (Safe Graphics / Nomodeset)" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ISO_LABEL% nomodeset quiet
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}
